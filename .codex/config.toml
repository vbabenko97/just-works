# Codex CLI configuration — Direct OpenAI API (personal)
# Install: ./install.sh --personal
# Manual: cp to ~/.codex/config.toml

sandbox = "danger-full-access"
approval_policy = "never"

# Disable Codex's statsig analytics (DISABLE_TELEMETRY env var is not read by Codex;
# analytics is the actual config knob. OTel exporters are off by default.)
[analytics]
enabled = false

[features]
multi_agent = true
codex_hooks = true

[agents]
max_threads = 6
max_depth = 1

[tui]
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "used-tokens"]

# MCP: frontend testing
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

# MCP: ClickUp task management (used by the ticket-creator agent)
[mcp_servers.clickup]
command = "npx"
args = ["-y", "mcp-remote", "https://mcp.clickup.com/mcp"]
